<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando Nebula Launcher</title>
  <style>
    :root {
      --bg-dark: #0f1016;
      --accent-p: #a78bfa;
      --accent-s: #fbcfe8;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag; /* Permite arrastrar desde cualquier parte del splash */
    }

    .splash-container {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: rgba(15, 16, 22, 0.85); /* Semi-transparente estilo vidrio */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(167, 139, 250, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Animación del fondo */
    .glow-orb {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.4) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseOrb 3s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes pulseOrb {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    }

    /* Logo Animado */
    .logo-container {
      position: relative;
      z-index: 2;
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cambia a cover para rellenar completamente el contenedor circular */
      border-radius: 50%; /* Corta las esquinas dejando un círculo perfecto */
      overflow: hidden;
      filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.6)); /* Un brillo algo más fuerte */
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    /* Spinner Circular Alrededor del Logo */
    .spinner-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-top: 3px solid var(--accent-p);
      border-radius: 50%;
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Textos */
    .title {
      z-index: 2;
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, var(--accent-s));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      z-index: 2;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 8px;
    }

    /* Loading dots */
    .dots::after {
      content: '.';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="glow-orb"></div>
    <div class="logo-container">
        <span class="status-text" id="status-text">Iniciando aplicación instantánea...</span>
        <span class="status-pct" id="status-pct">100%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width: 100%;"></div>
      <!-- Usamos icon.ico pero si falla el src, mostramos un fallback bonito en CSS -->
      <img src="icon.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
    </div>
    <h1 class="title">Nebula Launcher</h1>
    <p class="subtitle">Inicializando componentes<span class="dots"></span></p>
  </div>
</body>
</html>
