<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nebula Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; display: flex; align-items: center; justify-content: center;
      -webkit-app-region: drag;
    }
    .splash-card {
      width: 340px;
      padding: 26px 30px;
      border-radius: 24px;
      background: rgba(10, 12, 26, 0.94);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(250, 204, 21, 0.45);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(250, 204, 21, 0.25);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      animation: splashPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes splashPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .logo-ring-container {
      position: relative; width: 72px; height: 72px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #facc15; border-right-color: #38bdf8;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-img {
      width: 52px; height: 52px; border-radius: 16px;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.4);
      object-fit: cover;
    }
    .title-group { text-align: center; }
    .app-title {
      font-size: 1.15rem; font-weight: 700; color: #ffffff;
      margin: 0; letter-spacing: -0.2px;
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .app-subtitle {
      font-size: 0.72rem; color: rgba(255, 255, 255, 0.5);
      margin-top: 3px; font-weight: 500;
    }
    .progress-box { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .progress-info {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.76rem; font-weight: 600;
    }
    .status-text { color: #fef08a; }
    .status-pct { color: #38bdf8; }
    .progress-bar-bg {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08);
      border-radius: 99px; overflow: hidden; position: relative;
    }
    .progress-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #facc15, #38bdf8);
      border-radius: 99px; transition: width 0.2s ease;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-ring-container">
      <div class="logo-ring"></div>
      <img src="icon.ico" class="logo-img" onerror="this.src='fussionborn_logo.png'">
    </div>
    <div class="title-group">
      <h2 class="app-title">Nebula Launcher</h2>
      <div class="app-subtitle">Cargando módulos en tiempo real...</div>
    </div>
    <div class="progress-box">
      <div class="progress-info">
        <span class="status-text" id="status-text">Iniciando aplicación instantánea...</span>
        <span class="status-pct" id="status-pct">100%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width: 100%;"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-progress', (event, { text, progress }) => {
      const txtEl = document.getElementById('status-text');
      const pctEl = document.getElementById('status-pct');
      const fillEl = document.getElementById('progress-fill');

      if (txtEl && text) txtEl.textContent = text;
      if (pctEl && progress !== undefined) pctEl.textContent = `${progress}%`;
      if (fillEl && progress !== undefined) fillEl.style.width = `${Math.min(100, Math.max(0, progress))}%`;
    });
  </script>
</body>
</html>
